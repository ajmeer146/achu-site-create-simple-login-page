<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Professional Corporate</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <div class="container">
      <a href="#" class="logo">Corporate Platform</a>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="login-page">
    <div class="container">
      <section class="login-card">
        <h2>Sign In</h2>
        <p>Enter your credentials to access the platform</p>

        <form id="loginForm" action="#">
          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
          </div>

          <div class="form-options">
            <label>
              <input type="checkbox" id="remember">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-password">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary">Sign In</button>

          <p class="divider">or continue with</p>

          <div class="social-login">
            <button class="btn-social">Google</button>
            <button class="btn-social">Microsoft</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 Corporate Platform. All rights reserved.</p>
      <nav>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
      </nav>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
